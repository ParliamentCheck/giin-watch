name: 日次データ収集

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      skip_keywords:
        description: "キーワード更新をスキップする"
        type: boolean
        default: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  PYTHONPATH: apps/collector
  SKIP_KEYWORDS: ${{ inputs.skip_keywords }}

jobs:
  collect:
    runs-on: ubuntu-latest
    # ジョブ全体の上限は最後の安全網。各ステップに個別の timeout-minutes を付け、
    # 1ステップの遅延で後続ステップが巻き添えでキャンセルされないようにしている。
    timeout-minutes: 240
    permissions:
      contents: read
      issues: write
      actions: write  # 60日停止対策（最終ステップで自分自身を再有効化する）

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r apps/collector/requirements.txt
          sudo apt-get update && sudo apt-get install -y mecab libmecab-dev

      - name: 議員データ登録
        id: members
        continue-on-error: true
        timeout-minutes: 20
        run: python apps/collector/sources/members.py

      - name: 発言データ収集
        id: speeches
        continue-on-error: true
        timeout-minutes: 60
        env:
          # 一時停止中: 発言収集のたびに収集窓（365日）全体の回数を既存の回数へ加算してしまい、
          # ワードクラウドの回数が水増しされるため。キーワード処理の修正と全件再構築まで止める。
          SKIP_INLINE_KEYWORDS: "1"
        run: python apps/collector/sources/speeches.py

      - name: 活動スコア再計算
        id: scoring
        continue-on-error: true
        timeout-minutes: 15
        run: python apps/collector/processors/scoring.py

      - name: 内閣役職データ取得
        id: cabinet
        continue-on-error: true
        timeout-minutes: 5
        run: python apps/collector/sources/cabinet_scraper.py

      - name: 質問主意書収集
        id: questions
        continue-on-error: true
        timeout-minutes: 15
        run: python apps/collector/sources/questions.py

      - name: 請願収集
        id: petitions
        continue-on-error: true
        timeout-minutes: 15
        run: python apps/collector/sources/petitions.py

      - name: 採決記録収集（現会期）
        id: votes
        continue-on-error: true
        timeout-minutes: 10
        run: python apps/collector/sources/votes.py --mode daily

      # 一時停止中: 法案IDを「掲載会期」で作っているため、継続審査中の法案（第221回提出・第222回掲載）が
      # 別IDで二重登録される。ID を「提出回次＋番号」に直すまで止める。
      - name: 議員立法・閣法収集（日次）
        id: bills
        if: false
        continue-on-error: true
        timeout-minutes: 30
        run: python apps/collector/sources/bills.py --daily

      - name: 委員会所属収集
        id: committees
        continue-on-error: true
        timeout-minutes: 15
        run: python apps/collector/sources/committees.py

      - name: 政党採決一致率計算
        id: vote_alignment
        continue-on-error: true
        timeout-minutes: 10
        run: python apps/collector/sources/vote_alignment.py

      # 一時停止中: 7日窓が毎日重なって同じ発言を複数回数えるため。修正と全件再構築まで止める。
      - name: キーワード更新
        id: keywords
        if: false && inputs.skip_keywords != true
        continue-on-error: true
        timeout-minutes: 20
        run: python apps/collector/sources/keywords.py --mode daily

      - name: 実行結果サマリー
        if: always()
        run: |
          echo "## 実行結果"
          echo "| ステップ | 結果 |"
          echo "|---------|------|"
          echo "| 議員データ登録 | ${{ steps.members.outcome }} |"
          echo "| 発言データ収集 | ${{ steps.speeches.outcome }} |"
          echo "| スコア再計算 | ${{ steps.scoring.outcome }} |"
          echo "| 内閣役職 | ${{ steps.cabinet.outcome }} |"
          echo "| 質問主意書 | ${{ steps.questions.outcome }} |"
          echo "| 請願収集 | ${{ steps.petitions.outcome }} |"
          echo "| 採決記録 | ${{ steps.votes.outcome }} |"
          echo "| 議員立法・閣法 | ${{ steps.bills.outcome }} |"
          echo "| 委員会所属 | ${{ steps.committees.outcome }} |"
          echo "| 政党採決一致率 | ${{ steps.vote_alignment.outcome }} |"
          echo "| キーワード更新 | ${{ steps.keywords.outcome }} |"

      - name: speeches 上限チェック・削除
        id: cleanup
        continue-on-error: true
        timeout-minutes: 10
        run: python apps/collector/processors/cleanup.py --task truncate-speeches

      - name: データ品質監査
        id: audit
        continue-on-error: true
        timeout-minutes: 10
        run: python apps/collector/processors/audit.py --output /tmp/audit_report.md

      - name: 監査エラーをIssueに報告
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "データ品質監査: 不整合を検出 $(date +%Y-%m-%d)" \
            --body "$(cat /tmp/audit_report.md)"

      - name: 失敗チェック
        if: always()
        run: |
          if [ "${{ steps.members.outcome }}" = "failure" ] || \
             [ "${{ steps.speeches.outcome }}" = "failure" ] || \
             [ "${{ steps.scoring.outcome }}" = "failure" ]; then
            echo "::warning::1つ以上のステップが失敗しました"
          fi

      # GitHub は公開リポジトリで60日間アクティビティがないと定期実行を自動停止する
      # （2026-06-14 に実際に停止し、約4か月データが止まった）。
      # 毎回の実行の最後に自分自身を再有効化して、停止カウンターをリセットする。
      - name: 定期実行の自動停止を防ぐ（keepalive）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
